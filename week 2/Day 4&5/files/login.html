<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — Aura Store</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="brand">
      <h1>✦ AURA</h1>
      <p>Premium Online Store</p>
    </div>
    <h2 class="auth-title">Welcome Back</h2>

    <div class="alert alert-error" id="errorMsg"></div>

    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="jane@example.com" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Your password" />
    </div>

    <button class="btn btn-primary btn-full" onclick="login()">Log In</button>

    <p class="auth-footer">No account yet? <a href="singup.html">Sign up →</a></p>
  </div>
</div>

<script>
// Redirect if already logged in
if (localStorage.getItem('aura_session')) window.location.href = 'index.html';

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg; el.classList.add('show');
}

function login() {
  const email    = document.getElementById('email').value.trim().toLowerCase();
  const password = document.getElementById('password').value;

  if (!email || !password) return showError('Please enter your email and password.');

  const users = JSON.parse(localStorage.getItem('aura_users') || '[]');
  const user  = users.find(u => u.email === email && u.password === password);

  if (!user) return showError('Incorrect email or password. Try again.');

  // Save session
  localStorage.setItem('aura_session', JSON.stringify({ name: user.name, email: user.email }));
  window.location.href = 'index.html';
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
