<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — Aura Store</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<nav id="mainNav"></nav>

<div class="checkout-page">
  <h1 style="font-size:2rem;margin-bottom:2rem">Checkout</h1>

  <div id="checkoutContent"></div>
</div>

<!-- Success overlay -->
<div class="success-overlay" id="successOverlay">
  <div class="success-card">
    <div class="success-icon">✦</div>
    <h2>Order Placed!</h2>
    <p>Thank you for your purchase. We'll send a confirmation to your email shortly.</p>
    <p id="orderNum" style="color:var(--accent);font-weight:600;margin-bottom:1.5rem"></p>
    <a href="index.html" class="btn btn-primary btn-full" onclick="clearOrderData()">Continue Shopping</a>
  </div>
</div>

<script src="app.js"></script>
<script>
  const session = requireLogin();
  renderNav('');

  function renderCheckout() {
    const cart = getCart();
    const content = document.getElementById('checkoutContent');

    if (cart.length === 0) {
      content.innerHTML = `
        <div class="cart-empty">
          <h2>Your cart is empty</h2>
          <a href="index.html" class="btn btn-primary" style="margin-top:1.5rem;display:inline-flex">Go Shopping</a>
        </div>`;
      return;
    }

    const subtotal  = cartTotal();
    const shipping  = subtotal > 100 ? 0 : 9.99;
    const tax       = +(subtotal * 0.08).toFixed(2);
    const grandTotal = +(subtotal + shipping + tax).toFixed(2);

    const orderItems = cart.map(item => {
      const p = PRODUCTS.find(pr => pr.id === item.id);
      return `<div class="order-item">
        <span>${p.name} × ${item.qty}</span>
        <span>$${(p.price * item.qty).toFixed(2)}</span>
      </div>`;
    }).join('');

    content.innerHTML = `
      <div class="checkout-grid">
        <!-- Form -->
        <div class="checkout-form-card">
          <h2>Shipping Details</h2>
          <div class="alert alert-error" id="formError"></div>

          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="shipName" value="${session ? session.name : ''}" placeholder="Jane Doe" />
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="shipEmail" value="${session ? session.email : ''}" placeholder="jane@example.com" />
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="shipPhone" placeholder="+1 (555) 000-0000" />
          </div>
          <div class="form-group">
            <label>Street Address</label>
            <input type="text" id="shipAddress" placeholder="123 Main St, Apt 4B" />
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
            <div class="form-group">
              <label>City</label>
              <input type="text" id="shipCity" placeholder="New York" />
            </div>
            <div class="form-group">
              <label>ZIP Code</label>
              <input type="text" id="shipZip" placeholder="10001" />
            </div>
          </div>

          <div class="form-group" style="margin-top:.5rem">
            <label>Payment Method</label>
            <select id="payMethod">
              <option value="card">Credit / Debit Card (demo)</option>
              <option value="paypal">PayPal (demo)</option>
              <option value="cod">Cash on Delivery</option>
            </select>
          </div>

          <button class="btn btn-primary btn-full" style="margin-top:.5rem" onclick="placeOrder()">
            Place Order — $${grandTotal}
          </button>
        </div>

        <!-- Summary -->
        <div class="order-summary-card">
          <h2>Order Summary</h2>
          ${orderItems}
          <div style="margin-top:1rem;border-top:1px solid var(--border);padding-top:1rem">
            <div class="summary-row"><span>Subtotal</span><span>$${subtotal.toFixed(2)}</span></div>
            <div class="summary-row"><span>Shipping</span><span>${shipping === 0 ? 'Free' : '$'+shipping.toFixed(2)}</span></div>
            <div class="summary-row"><span>Tax</span><span>$${tax}</span></div>
            <div class="summary-row total"><span>Total</span><span>$${grandTotal}</span></div>
          </div>
        </div>
      </div>
    `;
  }

  function placeOrder() {
    const name    = document.getElementById('shipName').value.trim();
    const email   = document.getElementById('shipEmail').value.trim();
    const phone   = document.getElementById('shipPhone').value.trim();
    const address = document.getElementById('shipAddress').value.trim();
    const city    = document.getElementById('shipCity').value.trim();
    const zip     = document.getElementById('shipZip').value.trim();
    const err     = document.getElementById('formError');

    if (!name || !email || !phone || !address || !city || !zip) {
      err.textContent = 'Please fill in all fields.';
      err.classList.add('show');
      err.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    err.classList.remove('show');

    // Generate order number
    const orderNum = 'AURA-' + Date.now().toString(36).toUpperCase();
    document.getElementById('orderNum').textContent = `Order #${orderNum}`;

    document.getElementById('successOverlay').style.display = 'flex';
  }

  function clearOrderData() {
    saveCart([]);
  }

  renderCheckout();
</script>
</body>
</html>
