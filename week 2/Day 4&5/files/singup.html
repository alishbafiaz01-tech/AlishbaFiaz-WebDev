<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — Aura Store</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="brand">
      <h1>✦ AURA</h1>
      <p>Premium Online Store</p>
    </div>
    <h2 class="auth-title">Create Account</h2>

    <div class="alert alert-error" id="errorMsg"></div>
    <div class="alert alert-success" id="successMsg"></div>

    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="name" placeholder="Jane Doe" />
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="jane@example.com" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Min. 6 characters" />
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="confirm" placeholder="Repeat password" />
    </div>

    <button class="btn btn-primary btn-full" onclick="signup()">Create Account</button>

    <p class="auth-footer">Already have an account? <a href="login.html">Log in →</a></p>
  </div>
</div>

<script>
function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg; el.classList.add('show');
  document.getElementById('successMsg').classList.remove('show');
}
function showSuccess(msg) {
  const el = document.getElementById('successMsg');
  el.textContent = msg; el.classList.add('show');
  document.getElementById('errorMsg').classList.remove('show');
}

function signup() {
  const name     = document.getElementById('name').value.trim();
  const email    = document.getElementById('email').value.trim().toLowerCase();
  const password = document.getElementById('password').value;
  const confirm  = document.getElementById('confirm').value;

  if (!name || !email || !password || !confirm) return showError('All fields are required.');
  if (!/^[^@]+@[^@]+\.[^@]+$/.test(email)) return showError('Enter a valid email address.');
  if (password.length < 6) return showError('Password must be at least 6 characters.');
  if (password !== confirm) return showError('Passwords do not match.');

  const users = JSON.parse(localStorage.getItem('aura_users') || '[]');
  if (users.find(u => u.email === email)) return showError('An account with this email already exists.');

  users.push({ name, email, password });
  localStorage.setItem('aura_users', JSON.stringify(users));

  showSuccess('Account created! Redirecting to login…');
  setTimeout(() => window.location.href = 'login.html', 1500);
}

// Allow Enter key
document.addEventListener('keydown', e => { if (e.key === 'Enter') signup(); });
</script>
</body>
</html>
